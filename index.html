<!doctype html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Task Reminder App</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="icon-192.png" />
    <meta name="theme-color" content="#007aff" />
    <!-- Flatpickr jika ingin konsisten (opsional) bisa ditambahkan, tapi tidak wajib -->
</head>
<body>
    <div class="phone-frame">
        <div class="app-header">
            <h2>Reminders</h2>
            <button id="theme-toggle">🌙</button>
        </div>

        <!-- Tampilan List / Calendar -->
        <div class="view-toggle">
            <button class="view-btn active" data-view="list">List</button>
            <button class="view-btn" data-view="calendar">Calendar</button>
        </div>

        <!-- Filter kategori -->
        <div class="filters">
            <button class="filter-btn active" data-filter="All">All</button>
            <button class="filter-btn" data-filter="Tugas">Tugas</button>
            <button class="filter-btn" data-filter="Personal">Personal</button>
            <button class="filter-btn" data-filter="Acara">Acara</button>
            <button class="filter-btn" data-filter="Janjian">Janjian</button>
        </div>

        <!-- Form tambah task -->
        <div class="add-task">
            <input type="text" id="task-input" placeholder="New reminder..." />
            <select id="category-input">
                <option value="Tugas">Tugas</option>
                <option value="Personal">Personal</option>
                <option value="Acara">Acara</option>
                <option value="Janjian">Janjian</option>
            </select>
            <input type="date" id="date-input" />
            <div class="time-inputs">
                <input type="number" id="hours-input" placeholder="HH" min="0" max="23" />
                <input type="number" id="minutes-input" placeholder="MM" min="0" max="59" />
                <input type="number" id="seconds-input" placeholder="SS" min="0" max="59" />
            </div>
            <button id="add-btn">Add</button>
        </div>

        <!-- List View -->
        <div id="list-view">
            <ul id="task-list" class="task-list"></ul>
        </div>

        <!-- Calendar View (awalnya tersembunyi) -->
        <div id="calendar-view" class="calendar-view hidden">
            <div class="calendar-header">
                <button id="prev-month">&lt;</button>
                <span id="current-month"></span>
                <button id="next-month">&gt;</button>
            </div>
            <div class="calendar-grid" id="calendar-grid"></div>
            <div class="selected-date-tasks">
                <h4>Tasks on <span id="selected-date"></span></h4>
                <ul id="task-list-date"></ul>
            </div>
        </div>

        <!-- Audio untuk efek suara saat hapus (base64 silent) -->
        <audio id="delete-sound" preload="auto">
            <source src="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YQAAAAA=" type="audio/wav" />
        </audio>
        <!-- Audio alarm (default, akan dimainkan jika diizinkan) -->
        <audio id="alarm-sound" preload="auto" loop>
            <source src="alarm.mp3" type="audio/mpeg" />
            <!-- Fallback: jika file tidak ada, bisa gunakan base64 atau suara lain -->
        </audio>
    </div>

    <script src="script.js"></script>
</body>
</html>
